name: hermes-secretary
version: 0.1.0
description: "Meeting secretary for Hermes: join Google Meet with a selected account profile, capture live captions in the background, and retrieve transcripts. Multi-account profiles live under ./secret/<account>/ (plugin-relative, gitignored)."
author: brewkeg
platforms:
  - linux
  - macos

provides_tools:
  - secretary_join_meet
  - secretary_start_capture
  - secretary_stop_capture
  - secretary_get_transcript
  - secretary_status
  - secretary_list_accounts

provides_hooks:
  - on_session_end

# Hermes installs/consents these when enabling the plugin (pyproject.toml wins if both exist).
python_dependencies:
  - playwright>=1.40

config_schema:
  type: object
  properties:
    secret_dir:
      type: string
      description: "Secret root (relative to plugin dir or absolute). Each account uses ./secret/<account>/ for its own Google sign-in/profile; keep private."
      default: "./secret"
    default_account:
      type: string
      description: "Optional default account/profile name used when secretary_join_meet is called without account."
    headless:
      type: boolean
      description: "Run browser headless. Set false for first-time Google sign-in."
      default: false
    capture_source:
      type: string
      enum: [google_meet_captions, whisper_local]
      default: google_meet_captions

capabilities: []
