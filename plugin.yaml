name: hermes-secretary
version: 0.1.0
description: "Meeting secretary for Hermes: join Google Meet as a guest, capture live captions in the background, and retrieve transcripts."
author: brewkeg
platforms:
  - linux
  - macos

provides_tools:
  - secretary_join_meet
  - secretary_start_capture
  - secretary_stop_capture
  - secretary_get_transcript
  - secretary_status

provides_hooks:
  - on_session_end

# Hermes installs/consents these when enabling the plugin (pyproject.toml wins if both exist).
python_dependencies:
  - playwright>=1.40

config_schema:
  headless:
    type: boolean
    default: false
    description: "Run browser headless. Keep false to watch the join and debug."
  capture_source:
    type: string
    enum: [google_meet_captions, whisper_local]
    default: google_meet_captions
    description: "Capture adapter. whisper_local is planned but not implemented yet."

capabilities: []
