<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Hermes Secretary</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <g id="w">
      <path d="M-20 0 C-70 -12 -120 -40 -175 -70 C-150 -40 -140 -30 -120 -22 C-140 -18 -150 -10 -165 4 C-140 4 -125 6 -108 12 C-125 22 -132 32 -140 48 C-100 36 -60 22 -20 14 Z" fill="url(#wing)"/>
    </g>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <!-- symmetric mark: wings + caption screen (looks identical when mirrored) -->
  <g transform="translate(320,225)">
    <circle r="118" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.9"/>
    <use href="#w" transform="translate(-60,-6)"/>
    <use href="#w" transform="translate(60,-6) scale(-1,1)"/>
    <rect x="-62" y="-48" width="124" height="96" rx="20" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <path d="M-34 -18h68M-34 0h68M-20 18h40" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" transform="translate(0,0)"/>
  </g>
</svg>
